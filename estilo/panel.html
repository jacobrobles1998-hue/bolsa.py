<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Login Neumórfico</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header">
        <h1>Profesionales AXON</h1>
        <h2>Conectamos entrenadores,nutricionistas y fisioterapeutas con personas que buscan resultados reales.</h2>
    </div>

    <div class="login-container">
        
        <div class="logo-circle">
            <div class="webdev-logo">
                <span class="lt">&lt;</span>
                <span class="gt">&gt;</span>
                <span class="made">Web Dev</span>
                <span class="easy">made easy!</span>
            </div>
        </div>

    

        <form action="#">
            <div class="input-group">
                <i class="far fa-user"></i>
                <input type="text" placeholder="username">
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="password">
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="links">
            <a href="#">Forgot password?</a> or <a href="#">Sign Up</a>
        </div>

    </div>

</body>
</html>
